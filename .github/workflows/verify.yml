name: Verify engineering calculations
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile sources
        run: python -m compileall -q src main.py
      - name: Headless calculation tests
        run: python -m pytest -q tests
      - name: Legacy regression checks
        run: for file in test_*.py; do python "$file"; done
      - name: Built-in checks
        run: python main.py --self-test
  windows-build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install builder and tests
        run: python -m pip install -r requirements-dev.txt pyinstaller pillow
      - name: Build desktop app
        run: pyinstaller --noconfirm --onefile --windowed --name ElevatorCalculator main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ElevatorCalculator-windows
          path: dist/ElevatorCalculator.exe
